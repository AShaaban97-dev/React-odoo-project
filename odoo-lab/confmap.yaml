apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: odoo
data:
  odoo.conf: |
    [options]
    addons_path = /mnt/extra-addons
    data_dir = /var/lib/odoo

    db_host = postgres
    db_port = 5432
    db_user = odoo
    db_password = odoo

    db_name = False
    dbfilter = .*
